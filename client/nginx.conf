server {
    listen 80;

    # Dynamic DNS resolution to prevent Nginx from crashing if backend is down on startup
    resolver ${RESOLVER} valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # IMPORTANT: backend proxy
    location /api/ {
        # Using a variable forces NGINX to resolve at runtime
        set $backend "${BACKEND_URL}";
        
        # We need to rewrite the path to remove the /api prefix?
        # No, the Node backend expects /api/rooms and /api/packages as seen in index.js
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
