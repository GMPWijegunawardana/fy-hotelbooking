version: "3.8"

services:

  backend:
    build:
      context: ./server
    container_name: hotel-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    restart: always

  frontend:
    build:
      context: ./client
    container_name: hotel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always